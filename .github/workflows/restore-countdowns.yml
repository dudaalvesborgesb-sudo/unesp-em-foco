name: Restore UNESP countdown cards

on:
  push:
    paths:
      - '.github/workflows/restore-countdowns.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore countdown cards
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          anchor = '''      </header>\n      <section class=\"view ${r.activeView === \"today\" ? \"active\" : \"\"}\" id=\"today-view\">${_()}</section>'''

          countdown = '''      </header>\n      <div class=\"exam-countdowns\" style=\"display:flex;flex-wrap:wrap;gap:12px;margin:0 0 20px;\">\n        <article style=\"flex:1 1 220px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);\">\n          <span class=\"eyebrow\">UNESP · 1ª fase</span>\n          <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:6px;\"><strong style=\"font-size:30px;line-height:1;\">${ne()}</strong><span style=\"color:var(--muted);font-weight:700;\">dias</span></div>\n          <small style=\"display:block;margin-top:7px;color:var(--muted);\">22 de novembro de 2026</small>\n        </article>\n        <article style=\"flex:1 1 220px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);\">\n          <span class=\"eyebrow\">UNESP · 2ª fase</span>\n          <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:6px;\"><strong style=\"font-size:30px;line-height:1;\">${fe()}</strong><span style=\"color:var(--muted);font-weight:700;\">dias</span></div>\n          <small style=\"display:block;margin-top:7px;color:var(--muted);\">13 de dezembro de 2026</small>\n        </article>\n      </div>\n      <section class=\"view ${r.activeView === \"today\" ? \"active\" : \"\"}\" id=\"today-view\">${_()}</section>'''

          if 'class=\"exam-countdowns\"' not in text:
              if anchor not in text:
                  raise SystemExit('Anchor not found; index.html left unchanged')
              text = text.replace(anchor, countdown, 1)
              path.write_text(text, encoding='utf-8')
              print('Countdown cards restored.')
          else:
              print('Countdown cards already present.')
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/restore-countdowns.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/restore-countdowns.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Restore first and second phase countdowns'
            git push
          fi
