duration:"1h20",subject:"Correção",title:"Analisar erros",priority:"high"},{id:"2026-11-19-c",time:"18:35",duration:"50 min",subject:"Prática",title:"Sem conteúdo novo",priority:"high"}],"2026-11-20":[{id:"2026-11-20-a",time:"15:30",duration:"1h20",subject:"REVISÃO FINAL",title:"Fórmulas, conceitos, caderno de erros, Humanas e redação",priority:"high"},{id:"2026-11-20-b",time:"17:05",duration:"1h20",subject:"Revisão leve",title:"Organização para prova",priority:"high"},{id:"2026-11-20-c",time:"18:35",duration:"50 min",subject:"Prática",title:"Encerrar cedo",priority:"high"}]},o=(e,a,i,t,s,n,d)=>({area:e,subject:a,topic:i,prompt:t,options:s,answer:n,explanation:d}),J=[o("Ciências Humanas","História","Primeira República","Em um município brasileiro do início do século XX, um grande proprietário oferecia transporte e favores aos moradores e, em troca, exigia apoio aos candidatos que indicava. Essa prática política estava associada",["ao voto censitário secreto.","ao coronelismo e ao controle local dos votos.","à autonomia sindical urbana.","ao parlamentarismo imperial.","à participação direta por plebiscitos."],1,"O coronelismo articulava poder econômico local, favores e controle eleitoral durante a Primeira República."),o("Ciências Humanas","História","Convênio de Taubaté","Em 1906, governos estaduais produtores de café acordaram comprar excedentes do produto por meio de empréstimos. O objetivo central dessa política era",["reduzir artificialmente a oferta e sustentar o preço do café.","substituir o café pela produção industrial.","distribuir terras aos trabalhadores imigrantes.","eliminar a participação estrangeira no comércio.","aumentar imediatamente a oferta no mercado mundial."],0,"A valorização do café retirava excedentes do mercado para evitar a queda de preços."),o("Ciências Humanas","História","Canudos","A Guerra de Canudos (1896–1897) pode ser compreendida, historicamente, como resultado",["da disputa diplomática entre Brasil e Argentina.","da tentativa de restaurar oficialmente a monarquia.","de tensões sociais no sertão e da repressão estatal a uma comunidade vista como ameaça.","de uma greve organizada por operários anarquistas.","da resistência indígena à mineração na Amazônia."],2,"Canudos reuniu sertanejos marginalizados em torno de Antônio Conselheiro e foi violentamente reprimido pela República."),o("Ciências Humanas","História","Era Vargas","A legislação trabalhista consolidada durante o governo Vargas ampliou direitos, mas também submeteu sindicatos ao controle estatal. Essa combinação revela",["a ausência completa do Estado nas relações de trabalho.","a conciliação entre proteção social e controle político dos trabalhadores.","a eliminação dos conflitos entre capital e trabalho.","a adoção do liberalismo econômico sem intervenção.","a transferência da legislação social aos municípios."],1,"O varguismo concedeu direitos e, simultaneamente, incorporou sindicatos à estrutura corporativa do Estado."),o("Ciências Humanas","História","Ditadura Militar","O Ato Institucional nº 5, de 1968, marcou o endurecimento da ditadura brasileira porque permitiu",["eleições presidenciais diretas e liberdade partidária.","a convocação de uma Assembleia Constituinte soberana.","o fechamento do Congresso, cassações e suspensão de garantias.","a anistia imediata de presos e exilados políticos.","a autonomia plena dos movimentos estudantis."],2,"O AI-5 concentrou poderes no Executivo e aprofundou a repressão e a censura."),o("Ciências Humanas","História","Abolição","A abolição da escravidão em 1888 não foi acompanhada por uma política ampla de terra, educação ou inserção profissional. Uma consequência duradoura dessa escolha foi",["o desaparecimento imediato das desigualdades raciais.","a integração econômica igualitária da população liberta.","a reprodução de desigualdades que limitaram a cidadania da população negra.","o retorno legal do trabalho compulsório africano.","a concentração dos libertos em cargos públicos."],2,"Sem reparação ou inclusão, a população liberta enfrentou barreiras que alimentaram desigualdades raciais estruturais."),o("Ciências Humanas","História","Revolução Francesa","A Declaração dos Direitos do Homem e do Cidadão proclamou igualdade jurídica, mas a participação política permaneceu inicialmente limitada por critérios de renda e gênero. A situação evidencia",["a inexistência de mudanças em relação ao Antigo Regime.","a distância entre a universalidade do discurso e os limites históricos de sua aplicação.","a defesa revolucionária dos privilégios de nascimento.","a rejeição iluminista aos direitos individuais.","a implantação imediata do sufrágio universal."],1,"Os princípios universais coexistiram com exclusões políticas concretas, como as de mulheres e não proprietários."),o("Ciências Humanas","História","Revolução Industrial","A expansão das fábricas na Inglaterra dos séculos XVIII e XIX contribuiu diretamente para",["a dispersão da população urbana pelo campo.","o fortalecimento exclusivo do artesanato doméstico.","a formação do proletariado e a aceleração da urbanização.","a extinção do trabalho assalariado.","a redução da divisão social do trabalho."],2,"A industrialização concentrou trabalhadores nas cidades e consolidou o proletariado assalariado."),o("Ciências Humanas","História","Imperialismo","Na segunda metade do século XIX, potências industriais europeias intensificaram a ocupação da África e da Ásia. Entre os interesses ligados a esse processo estava",["garantir matérias-primas, mercados e áreas de investimento.","impedir a circulação internacional de capitais.","promover a autonomia política imediata das colônias.","substituir a indústria pelo artesanato.","eliminar rivalidades entre as potências europeias."],0,"O imperialismo articulou expansão econômica, competição geopolítica e discursos racistas de legitimação."),o("Ciências Humanas","História","Primeira Guerra Mundial","A Primeira Guerra Mundial foi chamada de “guerra total” porque",["ficou restrita a pequenos exércitos profissionais.","mobilizou economia, tecnologia, propaganda e população civil em grande escala.","ocorreu sem participação das indústrias.","eliminou o nacionalismo europeu.","foi travada exclusivamente em territórios coloniais."],1,"Estados mobilizaram recursos econômicos e sociais inteiros, e civis passaram a ser profundamente atingidos."),o("Ciências Humanas","História","Guerra Fria","Durante a Guerra Fria, Estados Unidos e União Soviética evitaram um confronto militar direto de grande escala, mas apoiaram lados opostos em guerras locais. Essa dinâmica é denominada",["mercantilismo.","guerra por procuração.","isolacionismo absoluto.","descolonização negociada.","neutralidade armada medieval."],1,"As guerras por procuração transferiam a disputa entre as superpotências para conflitos regionais."),o("Ciências Humanas","História","Descolonização","A Conferência de Bandung, realizada em 1955, reuniu países africanos e asiáticos e expressou principalmente",["a defesa do colonialismo europeu.","a busca de autonomia diante dos blocos da Guerra Fria.","a criação do Pacto de Varsóvia.","o apoio à recolonização da Ásia.","a dissolução dos novos Estados nacionais."],1,"Bandung fortaleceu o anticolonialismo e a ideia de não alinhamento entre os blocos."),o("Ciências Humanas","Geografia","Globalização","Um celular pode ser projetado em um país, utilizar minerais extraídos em outro, ter peças fabricadas em vários territórios e ser montado onde os custos são menores. Esse exemplo caracteriza",["a autarquia econômica.","a fragmentação internacional das cadeias produtivas.","o fim da divisão internacional do trabalho.","a redução dos fluxos comerciais.","a produção exclusivamente artesanal."],1,"As cadeias globais distribuem diferentes etapas produtivas entre países conectados por fluxos de capital, informação e mercadorias."),o("Ciências Humanas","Geografia","Urbanização","Em muitas metrópoles, empregos e serviços concentram-se em áreas valorizadas, enquanto famílias de baixa renda vivem em locais distantes e com transporte precário. Essa organização do espaço revela",["segregação socioespacial.","transumância rural.","conurbação sem desigualdade.","descentralização industrial completa.","homogeneidade do preço da terra."],0,"A segregação socioespacial separa grupos no território urbano segundo renda e acesso desigual à infraestrutura."),o("Ciências Humanas","Geografia","Demografia","Um país apresenta queda acentuada da mortalidade, seguida, anos depois, pela diminuição da natalidade. Segundo o modelo de transição demográfica, nesse intervalo tende a ocorrer",["redução imediata da população absoluta.","crescimento vegetativo elevado.","igualdade entre natalidade e mortalidade em níveis altos.","desaparecimento da população jovem.","migração internacional obrigatória."],1,"Quando a mortalidade cai antes da natalidade, a diferença entre nascimentos e mortes aumenta temporariamente."),o("Ciências Humanas","Geografia","Climatologia urbana","Bairros densamente construídos, com pouco verde e muito asfalto, costumam registrar temperaturas superiores às áreas rurais próximas. Para reduzir esse fenômeno, uma medida adequada é",["ampliar superfícies impermeáveis.","retirar árvores das calçadas.","expandir áreas verdes e materiais de alta refletância.","canalizar todos os cursos d’água.","aumentar a concentração de edifícios sem ventilação."],2,"Vegetação, permeabilidade e superfícies mais refletivas ajudam a atenuar ilhas de calor."),o("Ciências Humanas","Geografia","Questão agrária","A modernização agrícola pode elevar a produtividade sem alterar a concentração fundiária. Nesse caso, é provável que permaneça",["a distribuição equilibrada da terra.","o conflito pelo acesso à terra.","a eliminação do trabalho temporário.","a agricultura sem uso de tecnologia.","a ausência de produção para exportação."],1,"Produtividade e estrutura fundiária são dimensões diferentes; modernização técnica não implica reforma agrária."),o("Ciências Humanas","Geografia","Cartografia","Em um mapa de escala 1:50 000, a distância entre dois pontos é de 2 cm. A distância real entre eles é",["100 m.","500 m.","1 km.","10 km.","100 km."],2,"Dois centímetros representam 100 000 cm, isto é, 1 000 m ou 1 km."),o("Ciências Humanas","Geografia","Energia","A hidroeletricidade é classificada como renovável, mas grandes barragens podem inundar extensas áreas e deslocar populações. A afirmação indica que",["toda fonte renovável é isenta de impactos.","renovabilidade e ausência de impacto são conceitos equivalentes.","uma fonte renovável também pode gerar custos socioambientais.","barragens não alteram ecossistemas fluviais.","apenas combustíveis fósseis transformam paisagens."],2,"Renovável descreve a reposição do recurso; não significa impacto ambiental zero."),o("Ciências Humanas","Geografia","Amazônia e clima","Parte da umidade que forma chuvas no Centro-Sul do Brasil é transportada da Amazônia após a evapotranspiração da floresta. A redução intensa da cobertura vegetal pode, portanto,",["aumentar necessariamente a umidade continental.","alterar a circulação de umidade e o regime de chuvas.","impedir toda evaporação oceânica.","eliminar as massas de ar tropicais.","tornar o clima brasileiro uniforme."],1,"A floresta recicla água e influencia os fluxos atmosféricos de umidade conhecidos como “rios voadores”."),o("Ciências Humanas","Geografia","Geopolítica","A ampliação da influência econômica e diplomática de diferentes centros de poder, sem o domínio isolado de uma única potência, corresponde a uma ordem",["feudal.","multipolar.","autárquica.","bipolar rígida.","colonial mercantilista."],1,"Multipolaridade indica a existência de vários polos relevantes de poder."),o("Ciências Humanas","Geografia","Migrações","Secas recorrentes, desemprego e perseguição política são exemplos de fatores que, nos estudos migratórios, funcionam principalmente como",["fatores de atração.","barreiras culturais neutras.","fatores de expulsão.","redes de retorno turístico.","indicadores de crescimento vegetativo."],2,"Fatores de expulsão empurram pessoas para fora do local de origem."),o("Ciências Humanas","Filosofia","Aristóteles","Uma estátua de bronze representa uma atleta, foi produzida por uma escultora e servirá como memorial. Na teoria aristotélica das quatro causas, a escultora corresponde à causa",["material.","formal.","eficiente.","final.","acidental."],2,"A causa eficiente é o agente ou processo responsável por produzir algo."),o("Ciências Humanas","Filosofia","Hobbes","Para Thomas Hobbes, indivíduos deixam o estado de natureza e instituem um poder soberano principalmente para",["preservar a guerra permanente entre todos.","garantir segurança e conter o conflito generalizado.","abolir qualquer regra comum.","eliminar toda forma de autoridade.","restaurar privilégios feudais por direito divino."],1,"O pacto transfere poder ao soberano para assegurar paz e autopreservação."),o("Ciências Humanas","Filosofia","Locke","Segundo John Locke, um governo que viola sistematicamente vida, liberdade e propriedade perde legitimidade porque",["os direitos dependem da vontade ilimitada do governante.","a autoridade política deriva do consentimento e deve proteger direitos naturais.","a propriedade é incompatível com a sociedade civil.","o poder legislativo não possui limites.","a liberdade existe somente antes de qualquer sociedade."],1,"Para Locke, o governo é fiduciário: recebe poder por consentimento para proteger direitos naturais."),o("Ciências Humanas","Filosofia","Marx","Em uma fábrica, a trabalhadora executa repetidamente uma pequena etapa, não controla o processo e não reconhece o produto como resultado de sua realização pessoal. Para Marx, essa experiência expressa",["alienação do trabalho.","ação comunicativa.","vontade geral.","imperativo categórico.","ócio criativo."],0,"A alienação separa o trabalhador do produto, do processo, de si e dos outros."),o("Ciências Humanas","Sociologia","Durkheim","Regras de linguagem já existiam antes do nascimento de uma pessoa e exercem pressão para que ela fale de modo compreensível ao grupo. Para Durkheim, elas exemplificam um fato social por serem",["individuais, espontâneas e biológicas.","exteriores, gerais e coercitivos.","naturais, imutáveis e hereditários.","privados, voluntários e isolados.","econômicos, raros e opcionais."],1,"Exterioridade, generalidade e coerção são características clássicas dos fatos sociais."),o("Ciências Humanas","Sociologia","Weber","Uma organização substitui decisões pessoais por normas escritas, funções especializadas e hierarquia de cargos. Esse processo se aproxima do conceito weberiano de",["racionalização burocrática.","anomia mecânica.","mais-valia absoluta.","consciência coletiva tribal.","determinismo geográfico."],0,"A burocracia moderna organiza a ação por regras formais, especialização e cálculo racional."),o("Ciências Humanas","Sociologia","Cidadania","A criação de um sistema público de saúde universal amplia principalmente a dimensão da cidadania relacionada aos direitos",["dinásticos.","sociais.","mercantis.","hereditários.","corporativos privados."],1,"Direitos sociais asseguram condições de bem-estar, como saúde, educação e proteção social."),o("Ciências Humanas","Sociologia","Cultura","Ao avaliar outra sociedade exclusivamente pelos costumes de seu próprio grupo e classificá-la como “atrasada”, uma pessoa adota uma postura",["relativista.","etnocêntrica.","anômica.","burocrática.","secularizada."],1,"Etnocentrismo toma a própria cultura como medida para julgar as demais."),o("Ciências da Natureza e Matemática","Biologia","Ecologia","Em uma cadeia alimentar, produtores armazenam 10 000 kJ de energia. Admitindo uma transferência aproximada de 10% entre níveis tróficos, a energia disponível para consumidores secundários será de",["10 kJ.","100 kJ.","1 000 kJ.","9 000 kJ.","10 000 kJ."],1,"Dos produtores passam cerca de 1 000 kJ aos consumidores primários e 100 kJ aos secundários."),o("Ciências da Natureza e Matemática","Biologia","Genética","Em uma espécie, uma característica recessiva manifesta-se apenas em indivíduos aa. No cruzamento entre dois heterozigotos (Aa × Aa), a probabilidade de um descendente apresentar a característica é",["0%.","25%.","50%.","75%.","100%."],1,"O cruzamento gera AA, Aa, Aa e aa; um dos quatro genótipos é recessivo."),o("Ciências da Natureza e Matemática","Biologia","Fisiologia humana","No sistema circulatório humano, a câmara cardíaca que impulsiona sangue oxigenado para a circulação sistêmica é",["o átrio direito.","o ventrículo direito.","o átrio esquerdo.","o ventrículo esquerdo.","a veia cava."],3,"O ventrículo esquerdo bombeia o sangue para a aorta e para os tecidos do corpo."),o("Ciências da Natureza e Matemática","Biologia","Imunologia","A vacinação protege o organismo principalmente porque",["substitui permanentemente todos os leucócitos.","estimula memória imunológica sem exigir a doença em sua forma natural.","impede qualquer mutação do agente infeccioso.","elimina a necessidade de resposta celular.","age como antibiótico contra todos os microrganismos."],1,"Vacinas apresentam antígenos de modo controlado e induzem células de memória."),o("Ciências da Natureza e Matemática","Biologia","Evolução","Após o uso repetido de um antibiótico, uma população bacteriana passa a apresentar maior proporção de indivíduos resistentes. A explicação evolutiva mais adequada é",["o antibiótico produziu mutações dirigidas em todas as bactérias.","bactérias resistentes já existentes deixaram mais descendentes.","as bactérias escolheram adaptar-se ao ambiente.","a resistência surgiu pelo desuso dos genes.","todas as bactérias se tornaram geneticamente idênticas."],1,"O antibiótico atua como pressão seletiva, favorecendo variantes resistentes que já existiam ou surgiram ao acaso."),o("Ciências da Natureza e Matemática","Biologia","Citologia","Na respiração celular aeróbia, a maior parte do ATP é produzida",["nos ribossomos, durante a tradução.","na membrana interna das mitocôndrias, pela cadeia respiratória.","no complexo golgiense, durante a secreção.","nos lisossomos, pela digestão intracelular.","no núcleo, durante a duplicação do DNA."],1,"A fosforilação oxidativa ocorre na membrana interna mitocondrial e produz a maior parcela de ATP."),o("Ciências da Natureza e Matemática","Biologia","Botânica","Em situação de déficit hídrico, muitas plantas fecham os estômatos. Essa resposta reduz diretamente",["a perda de água por transpiração.","a absorção de sais pelas raízes a zero.","a produção de clorofila em todas as folhas.","a divisão celular do meristema permanentemente.","o transporte de seiva bruta apenas por gravidade."],0,"O fechamento estomático diminui a saída de vapor d’água, embora também limite a entrada de CO₂."),o("Ciências da Natureza e Matemática","Biologia","Parasitologia","A ampliação do saneamento básico contribui para prevenir várias parasitoses porque",["aumenta o contato com fezes contaminadas.","interrompe rotas de transmissão ligadas à água e aos resíduos humanos.","substitui todas as vacinas.","elimina apenas doenças genéticas.","favorece hospedeiros intermediários."],1,"Tratamento de água e esgoto reduz a circulação de ovos, cistos e larvas de diversos parasitas."),o("Ciências da Natureza e Matemática","Química","Ligações químicas","O cloreto de sódio sólido é constituído por íons Na⁺ e Cl⁻ organizados em rede cristalina. Sua ligação predominante resulta",["do compartilhamento igual de elétrons entre ametais.","da atração eletrostática entre íons de cargas opostas.","de ligações de hidrogênio entre moléculas.","da mobilidade de elétrons em uma rede metálica.","de forças dipolo induzido entre átomos neutros."],1,"A transferência de elétron gera íons, que se mantêm unidos por atração eletrostática."),o("Ciências da Natureza e Matemática","Química","Estequiometria","Na reação 2 H₂ + O₂ → 2 H₂O, a queima completa de 4 mol de H₂, com oxigênio em excesso, produz uma massa de água igual a",["18 g.","36 g.","54 g.","72 g.","90 g."],3,"A proporção H₂:H₂O é 1:1. Quatro mol de água correspondem a 4 × 18 = 72 g."),o("Ciências da Natureza e Matemática","Química","Soluções","Uma solução foi preparada dissolvendo-se 20 g de soluto até completar 500 mL de solução. Sua concentração comum é",["10 g/L.","20 g/L.","40 g/L.","100 g/L.","400 g/L."],2,"C = m/V = 20 g/0,5 L = 40 g/L."),o("Ciências da Natureza e Matemática","Química","pH","Uma solução aquosa apresenta concentração de íons H⁺ igual a 1,0 × 10⁻³ mol/L. Considerando pH = −log[H⁺], seu pH é",["1.","2.","3.","10.","11."],2,"O logaritmo de 10⁻³ é −3; portanto, o pH vale 3."),o("Ciências da Natureza e Matemática","Química","Termoquímica","Uma combustão libera calor para o ambiente. Em relação ao sistema químico, esse processo é",["endotérmico e possui ΔH positivo.","exotérmico e possui ΔH negativo.","isotérmico e possui ΔH nulo.","endotérmico e possui ΔH negativo.","exotérmico e possui ΔH positivo."],1,"Na reação exotérmica, os produtos têm entalpia menor e ΔH é negativo."),o("Ciências da Natureza e Matemática","Química","Equilíbrio químico","No equilíbrio N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g), um aumento de pressão, a temperatura constante, favorece",["os reagentes, porque possuem menos mol de gás.","os produtos, porque possuem menos mol de gás.","os reagentes, porque a reação para.","igualmente ambos os lados, sem deslocamento.","a decomposição completa da amônia."],1,"O aumento da pressão desloca o equilíbrio para o lado com menor quantidade gasosa: dois mol nos produtos."),o("Ciências da Natureza e Matemática","Química","Química orgânica","A reação entre um ácido carboxílico e um álcool, com formação de água, produz principalmente",["um alcano.","um éster.","uma amina.","um aldeído.","um sal metálico."],1,"A esterificação forma éster e água a partir de ácido carboxílico e álcool."),o("Ciências da Natureza e Matemática","Física","Cinemática","A velocidade de um carro aumenta uniformemente de 10 m/s para 30 m/s em 5 s. Sua aceleração média é",["2 m/s².","4 m/s².","5 m/s².","8 m/s².","20 m/s²."],1,"a = Δv/Δt = (30 − 10)/5 = 4 m/s²."),o("Ciências da Natureza e Matemática","Física","Dinâmica","Uma força resultante horizontal de 20 N atua sobre um corpo de 10 kg em uma superfície sem atrito. A aceleração do corpo vale",["0,5 m/s².","2 m/s².","10 m/s².","20 m/s².","200 m/s²."],1,"Pela segunda lei de Newton, a = F/m = 20/10 = 2 m/s²."),o("Ciências da Natureza e Matemática","Física","Energia","Um objeto de 2 kg é elevado verticalmente a 5 m de altura. Adotando g = 10 m/s², o aumento de energia potencial gravitacional é",["10 J.","25 J.","50 J.","100 J.","250 J."],3,"ΔEₚ = mgh = 2 × 10 × 5 = 100 J."),o("Ciências da Natureza e Matemática","Física","Eletrodinâmica","Um resistor de 10 Ω é ligado a uma diferença de potencial de 20 V. A corrente elétrica que o atravessa é",["0,5 A.","2 A.","10 A.","20 A.","200 A."],1,"Pela lei de Ohm, I = V/R = 20/10 = 2 A."),o("Ciências da Natureza e Matemática","Física","Ondulatória","Uma onda de frequência 5 Hz possui comprimento de onda de 2 m. Sua velocidade de propagação é",["2,5 m/s.","5 m/s.","7 m/s.","10 m/s.","25 m/s."],3,"v = λf = 2 × 5 = 10 m/s."),o("Ciências da Natureza e Matemática","Física","Óptica","Um objeto real é colocado além do dobro da distância focal de uma lente convergente. A imagem formada é",["virtual, direita e ampliada.","real, invertida e reduzida.","real, direita e do mesmo tamanho.","virtual, invertida e reduzida.","imprópria, formada no infinito."],1,"Para objeto além de 2f, a imagem surge entre f e 2f, real, invertida e menor."),o("Ciências da Natureza e Matemática","Física","Calorimetria","Para aquecer 200 g de água em 10 °C, considerando calor específico 4,2 J/(g·°C), é necessário fornecer",["420 J.","840 J.","4 200 J.","8 400 J.","84 000 J."],3,"Q = mcΔT = 200 × 4,2 × 10 = 8 400 J."),o("Ciências da Natureza e Matemática","Matemática","Porcentagem","Um produto de R$ 100 recebe desconto de 20% e, depois, aumento de 20% sobre o novo preço. O valor final é",["R$ 80.","R$ 96.","R$ 100.","R$ 104.","R$ 120."],1,"Após o desconto, o preço é 80; aumentando 20% de 80, chega a 96."),o("Ciências da Natureza e Matemática","Matemática","Função afim","Se f(x) = 2x + 3, então f(4) é igual a",["5.","8.","10.","11.","14."],3,"f(4) = 2·4 + 3 = 11."),o("Ciências da Natureza e Matemática","Matemática","Função quadrática","As raízes da equação x² − 5x + 6 = 0 são",["−3 e −2.","−2 e 3.","1 e 6.","2 e 3.","5 e 6."],3,"A fatoração é (x − 2)(x − 3), logo as raízes são 2 e 3."),o("Ciências da Natureza e Matemática","Matemática","Geometria plana","Um triângulo possui base de 12 cm e altura de 5 cm. Sua área é",["17 cm².","30 cm².","34 cm².","60 cm².","120 cm²."],1,"A = bh/2 = 12 × 5/2 = 30 cm²."),o("Ciências da Natureza e Matemática","Matemática","Probabilidade","Dois dados honestos são lançados. A probabilidade de a soma dos resultados ser 7 é",["1/12.","1/6.","1/4.","1/3.","1/2."],1,"Há seis pares favoráveis entre 36 resultados equiprováveis: 6/36 = 1/6."),o("Ciências da Natureza e Matemática","Matemática","Análise combinatória","Uma comissão de duas pessoas será escolhida entre cinco estudantes. O número de comissões diferentes é",["5.","8.","10.","20.","25."],2,"A ordem não importa: C(5,2) = 5·4/2 = 10."),o("Ciências da Natureza e Matemática","Matemática","Estatística","Para os valores 2, 4, 4, 5 e 10, a mediana e a média aritmética são, respectivamente,",["4 e 4.","4 e 5.","5 e 4.","5 e 5.","5 e 10."],1,"O valor central é 4 e a soma 25 dividida por 5 resulta em média 5."),o("Ciências da Natureza e Matemática","Matemática","Função exponencial","Uma cultura começa com 200 bactérias e dobra a cada 3 horas. Mantido esse ritmo, após 9 horas haverá",["400 bactérias.","600 bactérias.","800 bactérias.","1 200 bactérias.","1 600 bactérias."],4,"Em 9 horas ocorrem três duplicações: 200 × 2³ = 1 600."),o("Linguagens e Códigos","Português","Interpretação","Leia o enunciado de uma campanha fictíc
